<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="welcome_title">Billiard Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/consumption.css">
    <link rel="stylesheet" href="css/gamestation.css">
</head>

<body>
    <main>
        <div id="container">
            <div class="flipper">
                <div id="containerGamingStation">
                    <!-- Gaming station area -->
                    <!-- Cash button moved here so it rotates together with the panel -->
                    <button class="cash-button" id="Cash" aria-label="Cassa" title="Cassa" data-translate-title="cash_button">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28" class="cash-icon-svg">
                            <path d="M19 6h-2V3a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v3H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM9 4h6v2H9V4zm10 16H5V8h14v12zm-8-3H7v-2h4v2zm6 0h-4v-2h4v2zm-6-4H7v-2h4v2zm6 0h-4v-2h4v2z"/>
                        </svg>
                    </button>

                    <!-- Dedicated wrapper for blocks: used by scripts so the button is not touched -->
                    <div id="gamingBlocks" class="gaming-blocks"></div>

                </div>
                <div id="containerConfigStation">
                    <div class="config-header">
                        <h1 data-translate="settings_title">Impostazioni</h1>
                    </div>

                    <div class="config-panels-slider">
                        <!-- Panel 1 -->
                        <div class="config-subpanel active" id="gamingStation-settings-panel">
                            <h2 data-translate="gamingStation_settings_title">Gaming Stations</h2>
                            <p>Contenuto pannello 1...</p>
                        </div>
                        <!-- Panel 2 -->
                        <div class="config-subpanel" id="general-settings-panel">
                            <h2 data-translate="general_settings_title">General</h2>
                            <div class="settings-form">
                                <label for="billiardRoomName" data-translate="billiard_room_name_label">Billiard room name</label>
                                <input id="billiardRoomName" type="text" class="text-input" placeholder="Nome sala..." />

                                <label for="backgroundImageUrl" data-translate="background_image_label">Background image</label>
                                <div class="background-input-row" style="display:flex;gap:8px;align-items:center;">
                                    <input id="backgroundImageUrl" type="text" class="text-input" placeholder="URL immagine..." style="flex:1;" />
                                    <input id="backgroundImageFile" type="file" accept="image/*" />
                                </div>

                                <div id="backgroundPreview" class="background-preview" style="margin-top:8px;">
                                    <img id="backgroundPreviewImg" src="" alt="" style="max-width:100%;height:auto;display:none;border:1px solid #ddd;padding:4px;" />
                                </div>

                                <div class="settings-actions" style="margin-top:10px;">
                                    <button id="saveGeneralSettings" class="btn btn-save" data-translate="save">Salva</button>
                                    <button id="cancelGeneralSettings" class="btn btn-cancel" data-translate="cancel">Annulla</button>
                                </div>
                            </div>
                        </div>
                        <!-- Panel 3 -->
                        <div class="config-subpanel" id="system-settings-panel">
                            <h2 data-translate="system_settings_title">System</h2>
                            <p>Contenuto pannello 3...</p>
                        </div>
                    </div>

                    <div class="config-pagination">
                        <span class="dot active" data-index="0"></span>
                        <span class="dot" data-index="1"></span>
                        <span class="dot" data-index="2"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <button class="config-button" id="Config" aria-label="Config" title="Settings" data-translate-title="config_button">
        <img src="images/icons/settings.png" alt="Config" id="configIconImg" data-translate-alt="config_icon_alt">
    </button>

    <!-- Cash Drawer Panel (Transparency/Glassmorphism) -->
    <div id="cashDrawer" class="cash-drawer">
        <div class="cash-drawer-header">
            <h2 data-translate="cash_panel_title">Conti del Giorno</h2>
            <button id="closeCashDrawer" class="btn-close-drawer" aria-label="Close">&times;</button>
        </div>
        <div id="currentAccountingDayContainer" class="current-accounting-day" style="display: none;">
            <span id="currentAccountingDayDisplay"></span>
            <button id="changeAccountingDayBtn" class="btn-change-day" title="Cambia giorno contabile" data-translate-title="change_accounting_day">
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zM7 12h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"/>
                </svg>
            </button>
        </div>

        <!-- Accounting Day Picker -->
        <div id="accountingDayPicker" class="accounting-day-picker" style="display: none;">
            <h3 data-translate="select_accounting_day">Seleziona Giorno Contabile</h3>
            <div class="date-picker-row">
                <input type="date" id="accountingDayDate" class="date-picker-input">
                <div class="date-picker-actions">
                    <button id="confirmAccountingDay" class="btn btn-save" data-translate="ok">OK</button>
                    <button id="cancelAccountingDay" class="btn btn-cancel" data-translate="cancel" style="display: none;">Annulla</button>
                </div>
            </div>
        </div>

        <div class="cash-drawer-body">
            <!-- Totals Overview -->
            <div class="cash-totals-container">
                <div class="cash-total-card">
                    <span class="total-label" data-translate="cash_total_incoming">Entrate Effettive</span>
                    <span id="cashTotalIncoming" class="total-value">0.00 €</span>
                </div>
                <div class="cash-total-card">
                    <span class="total-label" data-translate="cash_total_expected">Entrate Attese</span>
                    <span id="cashTotalExpected" class="total-value">0.00 €</span>
                </div>
            </div>

            <!-- Checks List -->
            <h3 data-translate="cash_checks_list">Elenco Conti</h3>
            <div id="cashChecksList" class="cash-checks-list">
                <!-- Checks loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Consumption Modal -->
    <div id="consumptionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-translate="consumption_title">Consumazioni</h2>
            </div>
            <div class="modal-body">
                <div class="modal-main-panel">
                    <input type="text" id="consumptionSearch" class="search-field" placeholder="Cerca consumazione..." data-translate-placeholder="search_consumption">
                    <div id="consumptionList" class="consumption-list">
                        <!-- Consumption items will be loaded here -->
                    </div>
                </div>
                <div class="modal-side-panel">
                    <h3 data-translate="selected_items">Articoli Selezionati</h3>
                    <div id="selectedConsumptions" class="selected-consumptions">
                        <!-- Selected items will appear here -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelConsumption" class="btn btn-cancel" data-translate="cancel">Annulla</button>
                <button id="saveConsumption" class="btn btn-save" data-translate="save">Salva</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content confirm-modal-content">
            <div class="modal-header">
                <h2 data-translate="confirm_title">Conferma</h2>
            </div>
            <div class="modal-body confirm-modal-body">
                <p id="confirmMessage"></p>
            </div>
            <div class="modal-footer">
                <button id="confirmCancel" class="btn btn-cancel" data-translate="cancel">Annulla</button>
                <button id="confirmOk" class="btn btn-save" data-translate="confirm">Conferma</button>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="modal">
        <div class="modal-content confirm-modal-content">
            <div class="modal-header">
                <h2 data-translate="error_title">Errore</h2>
            </div>
            <div class="modal-body confirm-modal-body">
                <p id="errorMessage"></p>
            </div>
            <div class="modal-footer">
                <button id="errorOk" class="btn btn-save" data-translate="ok">OK</button>
            </div>
        </div>
    </div>

    <script src="scripts/utils.js"></script>
    <script src="scripts/cashScript.js"></script>
    <script src="scripts/consumptionScript.js"></script>
    <script src="scripts/gamingStationScript.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/translate.js"></script>
</body>
</html>
